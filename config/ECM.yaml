robot:
  name: ECM
  type: ecm
  model: Virtual/ECM.urdf.xacro
  parent_frame: world
  base_frame: ECM_base
  base_pose:
    position: [0.0, 0.0, 0.0]
    orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  rcm_frame: ECM_RCM
  tool_frame: ECM_optical
  adaptor_frame: ECM_adaptor_link

  joints:
    - name: yaw
      type: revolute
      lower: -1.5707963
      upper: 1.5707963
      velocity: 1.0
    - name: pitch
      type: revolute
      lower: -0.7853982
      upper: 0.7853982
      velocity: 1.0
    - name: insertion
      type: prismatic
      lower: 0.0
      upper: 0.299
      velocity: 0.4
    - name: roll
      type: revolute
      lower: -4.53786
      upper: 4.53786
      velocity: 1.0

  home_position: [0.0, 0.0, 0.08, 0.0]

  asset:
    endoscope: Si_straight
    use_endoscope_visual: true

  control:
    mode: kinematic
    update_rate_hz: 120.0
    state_publish_rate_hz: 100.0
    command_timeout_s: 0.25
    invalid_command_policy: reject

  cartesian:
    reference_frame: world
    measured_frame: ECM_optical

  camera:
    enabled: true
    frame: ECM_optical
    topic: image_raw
    camera_info_topic: camera_info
    width: 1280
    height: 720
    horizontal_fov_deg: 60.0
    near_clip_m: 0.01
    far_clip_m: 10.0
    encoding: rgba8
