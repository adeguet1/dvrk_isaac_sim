robot:
  name: PSM3
  type: psm
  model: Virtual/PSM1.urdf.xacro
  parent_frame: world
  base_frame: PSM3_base
  base_pose:
    position: [0.0, 0.0, 0.0]
    orientation_xyzw: [0.0, 0.0, 0.0, 1.0]
  rcm_frame: PSM3_RCM
  tool_frame: PSM3_tool
  adaptor_frame: PSM3_adaptor_link
  joints:
    - {name: yaw, type: revolute, lower: -1.5707963, upper: 1.5707963, velocity: 1.0}
    - {name: pitch, type: revolute, lower: -0.7853982, upper: 0.7853982, velocity: 1.0}
    - {name: insertion, type: prismatic, lower: 0.0, upper: 0.240, velocity: 0.4}
  home_position: [0.0, 0.0, 0.0]
  asset: {instrument: "420006", use_instrument_visual: true}
  control: {mode: kinematic, update_rate_hz: 120.0, state_publish_rate_hz: 100.0, command_timeout_s: 0.25, invalid_command_policy: reject}
  cartesian: {reference_frame: world, measured_frame: PSM3_tool}

